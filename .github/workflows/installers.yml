name: Instalatory Various Roots
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Zbuduj instalator x64
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $compiler)) { choco install nsis -y --no-progress }
          python scripts/package-windows.py --makensis $compiler
      - name: Sprawdź instalację, grę i odinstalowanie
        shell: pwsh
        run: |
          $setup = (Get-ChildItem out/*-Setup.exe).FullName
          $process = Start-Process $setup '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Błąd instalacji' }
          $dir = "$env:LOCALAPPDATA\Programs\Various Roots"
          if (!(Test-Path "$dir\runtime\VariousRoots.exe")) { throw 'Brak pliku gry' }
          if ((Get-FileHash "$dir\runtime\resources\app\index.html").Hash -ne (Get-FileHash dist/index.html).Hash) { throw 'Niezgodne zasoby gry' }
          node tests/installed-windows.mjs "$dir\runtime\VariousRoots.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/update-installed-windows.mjs "$dir\runtime\VariousRoots.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstaller = Start-Process "$dir\Uninstall.exe" -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($uninstaller.ExitCode -ne 0 -or (Test-Path "$dir\runtime\VariousRoots.exe")) { throw 'Błąd odinstalowania' }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: |
            out/*-Setup.exe
            out/latest.yml
          if-no-files-found: error

  android:
    outputs:
      signing_missing: ${{ steps.package.outputs.signing_missing }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Przygotuj narzędzia SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Zbuduj podpisany APK
        id: package
        env:
          PREVIEW_KEY: ${{ github.event_name != 'pull_request' && secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 || '' }}
        shell: bash
        run: |
          keystore="$RUNNER_TEMP/various-roots-preview.keystore"
          if [[ -n "$PREVIEW_KEY" ]]; then
            umask 077
            printf '%s' "$PREVIEW_KEY" | base64 --decode > "$keystore"
            python3 scripts/package-android.py --debug-keystore "$keystore"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            python3 scripts/package-android.py --debug-keystore "$keystore"
          elif [[ "$(node -p "require('./package.json').version")" == 0.1.2 ]]; then
            mkdir -p out
            package=Various-Roots-0.1.2-Android.apk
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/1aae15aea2440818e74f7edc15493092f898c73f/$package" --output "out/$package"
          else
            echo "signing_missing=true" >> "$GITHUB_OUTPUT"
            echo "::error::Dodaj sekret ANDROID_PREVIEW_KEYSTORE_BASE64 z kluczem wydania 0.1.2."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            sdk="$ANDROID_HOME/build-tools/35.0.0"
            certificate=$("$sdk/apksigner" verify --print-certs out/*.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            test "$certificate" = 94d5d55afc87237b118718af79f62b57bd5bc167a856281082b997be17f70a3b
            unzip -p out/*.apk assets/index.html | cmp - dist/index.html
            version=$(node -p "require('./package.json').version")
            "$sdk/aapt" dump badging out/*.apk > "$RUNNER_TEMP/package-info"
            head -1 "$RUNNER_TEMP/package-info" | grep -F "package: name='pl.variousroots.rework'" | grep -F "versionName='$version'"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: out/*.apk
          if-no-files-found: error

  preview:
    needs: [windows, android]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.windows.result == 'success' &&
      (needs.android.result == 'success' || needs.android.outputs.signing_missing == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: publish-various-roots-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Dodaj nowe wydanie testowe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          version="${tag#v}"
          apk="out/Various-Roots-$version-Android.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            # A signed APK may become available after the Windows release.
            if [[ -f "$apk" ]]; then
              assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
              if ! grep -Fxq "$(basename "$apk")" <<< "$assets"; then
                source_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)
                if [[ "$source_sha" != "$GITHUB_SHA" ]]; then
                  echo "::error::Uruchom ponownie zadanie dla commitu wydania $tag."
                  exit 1
                fi
                gh release upload "$tag" "$apk"
              fi
            fi
            exit 0
          fi
          files=("out/Various-Roots-$version-Windows-x64-Setup.exe" out/latest.yml)
          if [[ -f "$apk" ]]; then files+=("$apk"); fi
          notes_args=(--generate-notes)
          if [[ -f "releases/$tag.md" ]]; then notes_args=(--notes-file "releases/$tag.md"); fi
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title "Various Roots $tag" "${notes_args[@]}" "${files[@]}"
